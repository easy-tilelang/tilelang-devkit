name: test

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install '.[dev]'
      - name: Check framework-neutral import
        run: python -c "import sys, tilelang_devkit.lower_trace; assert 'tilelang' not in sys.modules"
      - run: python -m pytest tests/lower_trace/test_smoke.py -q
      - run: python -m pytest tests/lower_trace/test_public_api.py -k package_import -q
      - run: python -m build

  tilelang-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tilelang-devkit
      - uses: actions/checkout@v4
        with:
          repository: tile-ai/tilelang
          submodules: recursive
          path: tilelang
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only TileLang
        working-directory: tilelang
        env:
          USE_CUDA: "OFF"
          USE_LLVM: "OFF"
        run: python -m pip install . -v
      - run: python -m pip install './tilelang-devkit[dev]'
      - working-directory: tilelang
        run: python -m pytest ../tilelang-devkit/tests/lower_trace -q
